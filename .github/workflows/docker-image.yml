name: FEX ARM64 image

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '37 6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: fex-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Shell script checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - run: |
          for file in scripts/*.sh fex/*.sh tests/*.sh; do bash -n "$file"; done
          shellcheck -S warning scripts/*.sh fex/*.sh tests/*.sh
          python3 -B -m unittest discover -s tests -p 'test_*.py' -v
  releases:
    name: Resolve stable dependencies
    runs-on: ubuntu-24.04
    outputs:
      depot: ${{ steps.depot.outputs.version }}
    steps:
      - name: Read latest non-prerelease DepotDownloader
        id: depot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(gh api repos/SteamRE/DepotDownloader/releases/latest --jq .tag_name)
          version=${version#DepotDownloader_}
          [[ $version =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "version=$version" >> "$GITHUB_OUTPUT"
  fex:
    name: Build and smoke-test FEX ARM64
    needs: [lint, releases]
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/login-action@v4.6.0
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build (no publication before smoke test)
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/arm64
          load: true
          tags: corekeeper-fex:check
          build-args: |
            APT_REFRESH_NONCE=${{ github.run_id }}
            DEPOT_DOWNLOADER_VERSION=${{ needs.releases.outputs.depot }}
          cache-from: type=gha,scope=fex
          cache-to: type=gha,scope=fex,mode=max
      - name: Native guest and entry smoke tests
        run: |
          docker run --rm --network none --entrypoint bash -v "$PWD:/test-repo:ro" \
            corekeeper-fex:check /test-repo/tests/fex-image-smoke.sh
          docker run --rm --network none --entrypoint bash -v "$PWD:/test-repo:ro" \
            -v "$PWD/tests/setup-stub.sh:/home/steam/scripts/setup.sh:ro" \
            corekeeper-fex:check /test-repo/tests/entry-smoke.sh
      - name: Publish tested FEX image (main only)
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          COMMIT: ${{ github.sha }}
        run: |
          image="${IMAGE,,}"
          docker tag corekeeper-fex:check "$image:fex"
          docker tag corekeeper-fex:check "$image:latest"
          docker tag corekeeper-fex:check "$image:fex-${COMMIT}"
          docker push "$image:fex-${COMMIT}"
          docker push "$image:fex"
          docker push "$image:latest"
