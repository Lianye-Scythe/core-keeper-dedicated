services:
  core-keeper:
    image: ghcr.io/lianye-scythe/core-keeper-dedicated:fex
    container_name: core-keeper-dedicated
    restart: unless-stopped
    network_mode: bridge
    stop_grace_period: 2m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # Port is only needed if using direct connection mode
    # ports:
    #   - "7778:7778/udp"  # Match SERVER_PORT in core.env; it is not a Compose .env
    volumes:
      - type: bind
        source: /srv/corekeeper/server-files
        target: /home/steam/core-keeper-dedicated
      - type: bind
        source: /srv/corekeeper/server-data
        target: /home/steam/core-keeper-data
      - type: bind
        source: /srv/corekeeper/fex-cache
        target: /home/steam/.cache/fex
      - type: bind
        source: /srv/corekeeper/mesa-cache
        target: /home/steam/.cache/mesa_shader_cache
      - type: bind
        source: /srv/corekeeper/update-control
        target: /run/corekeeper-update
    env_file:
      - path: core.env
        required: false
    environment:
      COREKEEPER_RUNTIME: fex
      USE_DEPOT_DOWNLOADER: "true"
      FEX_MULTIBLOCK: "1"
      FEX_MAXINST: "16"
      FEX_SMCCHECKS: "1"
      # Startup updates are the default. Set UPDATE_GATE_ENABLED=true in core.env
      # only after installing the host maintenance timer; see the README.
      # Content activation is opt-in; configure it in core.env after backing up.
